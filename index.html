<!DOCTYPE html>
<html lang="mn">
<head>
<title>БМТС захиалга, хүргэлт</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00834A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ДТЛ захиалга">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* Layout: Odoo 19 вэб клиентийн загвар, Эрдэнэт үйлдвэрийн ногоон өнгөөр — нүүр дэлгэцийн апп дүрснүүд, дээд цэс, жагсаалт, маягт (statusbar, notebook, chatter) */
:root{
  --brand:#00834A; --brand-d:#006638; --brand-l:#E2F3EA;
  --bg:#F1F2F4; --sheet:#FFFFFF; --ink:#212529; --mute:#6C757D; --line:#DEE2E6; --line2:#EEF0F2;
  --ok:#1E8E4E; --ok-bg:#E1F3E8; --warn:#B76E00; --warn-bg:#FFF2D9; --err:#C0392B; --err-bg:#FBE5E3;
  --info:#017E84; --info-bg:#DDF2F3; --nav:#FFFFFF; --home1:#DDF0E5; --home2:#EAF3EE;
  --font:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --brand:#3FB57C; --brand-d:#6FD3A2; --brand-l:#1C3A2B;
  --bg:#1B1D21; --sheet:#262A2F; --ink:#E6E8EB; --mute:#9AA2AB; --line:#3A3F46; --line2:#30353B;
  --ok:#5CC98A; --ok-bg:#1F3A2B; --warn:#F0B44C; --warn-bg:#3D3020; --err:#F08A7E; --err-bg:#3D2422;
  --info:#5CC5CA; --info-bg:#1E3739; --nav:#262A2F; --home1:#16261E; --home2:#1B2420; color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#3FB57C; --brand-d:#6FD3A2; --brand-l:#1C3A2B;
  --bg:#1B1D21; --sheet:#262A2F; --ink:#E6E8EB; --mute:#9AA2AB; --line:#3A3F46; --line2:#30353B;
  --ok:#5CC98A; --ok-bg:#1F3A2B; --warn:#F0B44C; --warn-bg:#3D3020; --err:#F08A7E; --err-bg:#3D2422;
  --info:#5CC5CA; --info-bg:#1E3739; --nav:#262A2F; --home1:#16261E; --home2:#1B2420; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--nav)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand);text-decoration:none}
/* ---- дээд цэс ---- */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--nav);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;height:48px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav .grid-btn{width:38px;height:38px;border:0;background:transparent;border-radius:8px;display:grid;place-items:center;cursor:pointer}
.nav .grid-btn:hover{background:var(--line2)}
.nav .app-name{font-weight:600;font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .icon-btn{position:relative;width:38px;height:38px;border:0;background:transparent;border-radius:8px;display:grid;place-items:center;cursor:pointer}
.nav .badge-n{position:absolute;top:3px;right:2px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--err);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.avatar{width:30px;height:30px;border-radius:6px;background:var(--brand);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;flex:none}
/* ---- агуулга ---- */
.wrap{max-width:900px;margin:0 auto;padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.crumb{font-size:13px;color:var(--mute);margin:2px 0 8px}
.crumb a{color:var(--info)}
h1.title{font-size:22px;margin:0 0 4px;text-wrap:balance}
/* ---- нүүр: апп дүрснүүд ---- */
.home{min-height:calc(100vh - 48px);background:linear-gradient(160deg,var(--home1),var(--home2))}
.home .wrap{padding-top:22px}
.hello{font-size:14px;color:var(--mute);margin-bottom:18px;text-align:center}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:22px 10px;max-width:640px;margin:0 auto}
.app{display:flex;flex-direction:column;align-items:center;gap:8px;border:0;background:transparent;cursor:pointer;padding:4px;border-radius:12px;position:relative}
.app:focus-visible{outline:2px solid var(--brand)}
.app .ic{width:64px;height:64px;border-radius:14px;display:grid;place-items:center;box-shadow:0 1px 2px rgba(0,0,0,.12),0 4px 10px rgba(0,0,0,.06)}
.app .ic svg{width:34px;height:34px}
.app span{font-size:13px;text-align:center;line-height:1.2}
.app .dot{position:absolute;top:0;right:14px;min-width:20px;height:20px;border-radius:10px;background:var(--err);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
/* ---- товч ---- */
.btn{border:1px solid transparent;border-radius:6px;padding:7px 14px;font-weight:600;font-size:14px;cursor:pointer;background:var(--line2);color:var(--ink);white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--brand);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.danger{background:transparent;border-color:var(--err);color:var(--err)}
.btn.block{display:block;width:100%;padding:12px;font-size:16px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.cp{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 10px}
.cp .sp{flex:1}
/* ---- statusbar (Odoo сум) ---- */
.statusbar{display:flex;overflow-x:auto;margin:0 0 10px;border:1px solid var(--line);border-radius:6px;background:var(--sheet);scrollbar-width:none}
.statusbar::-webkit-scrollbar{display:none}
.statusbar span{flex:none;padding:6px 18px 6px 22px;font-size:12.5px;color:var(--mute);position:relative;white-space:nowrap;
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%,10px 50%);margin-left:-8px;background:var(--sheet)}
.statusbar span:first-child{margin-left:0;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%)}
.statusbar span.done{color:var(--ink)}
.statusbar span.cur{background:var(--brand-l);color:var(--brand);font-weight:700}
/* ---- sheet ---- */
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:16px;position:relative;overflow:hidden}
.sheet h2{font-size:22px;margin:0 0 10px;font-variant-numeric:tabular-nums}
.ribbon{position:absolute;top:14px;right:-34px;transform:rotate(45deg);padding:3px 40px;font-size:11px;font-weight:700;color:#fff;background:var(--err);letter-spacing:.04em}
.ribbon.ok{background:var(--ok)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px}
@media (max-width:620px){.fields{grid-template-columns:1fr}}
.f{display:grid;grid-template-columns:42% 1fr;gap:8px;padding:5px 0;border-bottom:1px solid var(--line2);font-size:14px}
.f label{color:var(--mute);font-weight:500}
.f div{min-width:0;overflow-wrap:anywhere}
.alert{border-radius:6px;padding:10px 12px;margin:0 0 12px;font-size:14px}
.alert.info{background:var(--info-bg);color:var(--info)}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert.ok{background:var(--ok-bg);color:var(--ok)}
.alert.err{background:var(--err-bg);color:var(--err)}
/* ---- notebook ---- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:16px 0 0;overflow-x:auto}
.tabs button{border:1px solid transparent;border-bottom:0;background:transparent;padding:8px 12px;border-radius:6px 6px 0 0;cursor:pointer;color:var(--mute);white-space:nowrap;font-size:14px}
.tabs button.on{border-color:var(--line);background:var(--sheet);color:var(--ink);font-weight:600;margin-bottom:-1px}
.tabpane{padding-top:8px}
/* ---- хүснэгт ---- */
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.t th{text-align:left;font-weight:600;color:var(--mute);border-bottom:1px solid var(--line);padding:7px 6px;white-space:nowrap;font-size:13px}
table.t td{border-bottom:1px solid var(--line2);padding:8px 6px;vertical-align:middle}
table.t td.n,table.t th.n{text-align:right}
table.t input{width:76px;text-align:right;padding:5px 6px;border:1px solid var(--line);border-radius:5px;background:var(--sheet)}
.sub{font-size:12px;color:var(--mute)}
/* ---- жагсаалт ---- */
.list{background:var(--sheet);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.row{display:flex;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line2);cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:var(--line2)}
.row .main{flex:1;min-width:0}
.row .top{display:flex;gap:8px;align-items:baseline}
.row .no{font-weight:600;font-variant-numeric:tabular-nums}
.row .meta{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--line2);color:var(--mute)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.err{background:var(--err-bg);color:var(--err)}
.pill.brand{background:var(--brand-l);color:var(--brand)}
.filters{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px}
.filters button{border:1px solid var(--line);background:var(--sheet);border-radius:16px;padding:5px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.filters button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.empty{background:var(--sheet);border:1px dashed var(--line);border-radius:8px;padding:28px 16px;text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
/* ---- chatter ---- */
.chatter{margin-top:14px}
.chatter h3{font-size:14px;margin:0 0 8px;color:var(--mute);font-weight:600}
.msg{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2)}
.msg .avatar{width:28px;height:28px;font-size:12px}
.msg .who{font-weight:600;font-size:13.5px}
.msg .when{font-size:12px;color:var(--mute);margin-left:6px}
.msg .body{font-size:14px}
/* ---- маягт ---- */
.form-grid{display:grid;gap:10px}
.inp{display:grid;gap:4px}
.inp label{font-size:13px;color:var(--mute);font-weight:500}
.inp input,.inp select,.inp textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--sheet)}
.inp input:focus,.inp select:focus,.inp textarea:focus{outline:2px solid var(--brand-l);border-color:var(--brand)}
.line-add{display:grid;grid-template-columns:1fr 90px auto;gap:6px;align-items:end}
/* ---- хүргэлт ---- */
.stop{border:1px solid var(--line);border-radius:8px;padding:12px;margin:10px 0;background:var(--sheet)}
.stop .hd{display:flex;align-items:center;gap:10px}
.stop .seq{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;font-weight:700;display:grid;place-items:center;flex:none}
.stop .hd .nm{flex:1;min-width:0;font-weight:600}
.road{height:8px;border-radius:4px;background:var(--line2);overflow:hidden;margin:10px 0 4px}
.road i{display:block;height:100%;background:var(--brand);border-radius:4px;transition:width .6s}
.qr{display:grid;place-items:center;gap:6px;padding:12px;background:#fff;border-radius:8px;border:1px solid var(--line);margin:10px auto;max-width:280px}
.qr .code{font:700 22px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.18em;color:#111}
.qr small{color:#555;text-align:center}
.big-plate{font:800 34px/1.1 ui-monospace,Menlo,Consolas,monospace;text-align:center;letter-spacing:.04em;margin:6px 0}
/* ---- тайлан ---- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:12px}
.kpi .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12.5px;color:var(--mute)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,46%) 1fr 64px;gap:8px;align-items:center;font-size:13px}
.bar .tr{height:12px;background:var(--line2);border-radius:6px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--brand)}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--mute)}
/* ---- мэдэгдэл, toast ---- */
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 56px);z-index:50;width:min(92vw,420px);
  background:var(--sheet);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:10px 12px;cursor:pointer;animation:drop .25s ease-out}
.toast .tt{font-weight:700;font-size:14px}
.toast .tb{font-size:13.5px;color:var(--mute)}
@keyframes drop{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.road i{transition:none}}
.ntf{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line2);cursor:pointer}
.ntf.unread{background:var(--brand-l)}
.ntf .tt{font-weight:600;font-size:14px}
.ntf .tb{font-size:13.5px}
.ntf .when{font-size:12px;color:var(--mute)}
/* ---- нэвтрэх ---- */
.login{max-width:440px;margin:24px auto}
.roles{display:grid;gap:6px}
.roles label{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);cursor:pointer}
.roles input{accent-color:var(--brand)}
.roles .rd{font-size:12.5px;color:var(--mute)}
.mode{font-size:12.5px;color:var(--mute);text-align:center;margin-top:8px}
.confirm{margin-top:10px;padding:12px;border:1px solid var(--err);border-radius:8px;background:var(--err-bg)}
.rmap{margin:10px 0;background:var(--line2);border:1px solid var(--line);border-radius:8px;padding:6px}
.rmap svg{width:100%;height:auto;display:block}
.rmap polyline{fill:none;stroke:var(--mute);stroke-width:2;stroke-linejoin:round;opacity:.55}
.rmap polyline.cur{stroke:var(--warn);stroke-width:3.5;opacity:1}
.rmap polyline.done{stroke:var(--ok);opacity:.8}
.rmap circle{fill:var(--brand);stroke:var(--sheet);stroke-width:2}.rmap circle.done{fill:var(--ok)}
.rmap rect{fill:var(--ink)}
.rmap text{fill:#fff;font-size:10px;font-weight:700;text-anchor:middle}
.rmap text.lb{fill:var(--ink);font-size:9.5px;font-weight:600;paint-order:stroke;stroke:var(--line2);stroke-width:3px}
.rmap figcaption{font-size:11.5px;color:var(--mute);padding:4px 4px 0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;border:1.5px solid var(--line);border-radius:8px;padding:10px;background:var(--sheet);height:100%}
.seg small{display:block;font-size:12px;color:var(--mute);margin-top:2px;font-weight:400}
.seg input:checked+span{border-color:var(--brand);background:var(--brand-l)}
.seg label.u input:checked+span{border-color:var(--err);background:var(--err-bg)}
.seg input:focus-visible+span{outline:2px solid var(--brand);outline-offset:2px}
.phase{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.phase>div{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--sheet)}
.phase .v{font-size:20px;font-weight:700}.phase .l{font-size:12px;color:var(--mute)}
.phase .n{font-size:11.5px;color:var(--mute);margin-top:4px}
.retbox{border:1px dashed var(--warn);border-radius:8px;padding:8px 10px;margin-top:10px;background:var(--warn-bg)}
.tl{display:flex;gap:4px;margin:10px 0;font-size:12px}
.tl span{flex:1;text-align:center;padding:6px 2px;border-radius:6px;background:var(--line2);color:var(--mute)}
.tl span.done{background:var(--ok-bg);color:var(--ok);font-weight:600}.tl span.cur{background:var(--brand-l);color:var(--brand);font-weight:700}
@media (max-width:520px){.phase{grid-template-columns:1fr}}
.lad{list-style:none;margin:8px 0 0;padding:0}
.lad li{display:flex;gap:10px;padding:9px 8px;border-radius:8px}
.lad .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;background:var(--line2);color:var(--mute)}
.lad li.done .n{background:var(--brand);color:#fff}
.lad li.cur{background:var(--warn-bg)}.lad li.cur .n{background:var(--warn);color:#fff}
.lad li.rej{background:var(--err-bg)}.lad li.rej .n{background:var(--err);color:#fff}
.lad li.work .n{background:none;border:2px dashed var(--line);font-size:0}
.lad li.work.done .n{border-style:solid;border-color:var(--brand);background:none}
.lad li.lock .t,.lad li.lock .d{color:var(--mute)}
.lad .b{flex:1;min-width:0}.lad .t{font-weight:600}.lad li.work .t{font-weight:400}
.lad .d{font-size:12.5px;color:var(--mute)}.lad .s{font-size:12.5px;margin-top:2px}
.sigp{height:8px;border-radius:4px;background:var(--line2);overflow:hidden;margin:6px 0 2px}.sigp i{display:block;height:100%;background:var(--brand)}
.stamp{display:inline-block;border:2px solid var(--brand);color:var(--brand);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;letter-spacing:.3px}
.sms{background:var(--sheet);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:10px 12px;margin:0 40px 10px 0;font-size:14px}
.sms .when{display:block;font-size:11.5px;color:var(--mute);margin-top:4px}
</style>
</head>
<body>

<div id="app" aria-live="polite"></div>
<div id="toast-slot"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
"use strict";
/* ===================== Тохиргоо (лавлах өгөгдөл) ===================== */
const ART_URL = ""; // хуваалцах холбоос (QR-д ашиглана)
const DEPTS = {
  uhc: {name:"Ус хангамжийн цех", lat:49.048963, lng:104.148408, km:2.43, route:[[49.04285,104.14074],[49.04242,104.1403],[49.03911,104.14458],[49.03953,104.14525],[49.04011,104.14505],[49.04072,104.14556],[49.04229,104.14811],[49.04298,104.14523],[49.04522,104.14206],[49.04654,104.14793],[49.04882,104.14675],[49.04918,104.14821],[49.04899,104.14837]]},

function hav(a,b){ const R=6371, r=x=>x*Math.PI/180; const d=Math.sin(r(b.lat-a.lat)/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(r(b.lng-a.lng)/2)**2; return 2*R*Math.asin(Math.sqrt(d)); }
/* from=null бол БМТС-ээс (Google Earth-д зурсан замын бодит урт), бусад үед цех хоорондын ойролцоо зам */
function legKm(from, to){
  const T = DEPTS[to];
  if (!from) return T.km;
  const F = DEPTS[from];
  if (F.lat && T.lat) return Math.round(hav(F,T)*ROAD_FACTOR*100)/100;
  return Math.max(0.6, Math.abs(T.km - F.km));
}

function orderStops(keys){
  const left=[...keys], out=[]; let cur=null;
  while(left.length){ left.sort((a,b)=>legKm(cur,a)-legKm(cur,b)); const n=left.shift(); out.push({dept:n, leg:legKm(cur,n)}); cur=n; }
  return out;
}

}

        const before = this.data[c]; this.data[c] = map;
        if (!snap.metadata.fromCache) { first++; if(first>=COLLS.length){ clearTimeout(timer); this.stale=false; } }

      Object.keys(this.data.notifications||{}).forEach(k=>Notif.shownAtLoad.add(k)); Notif.started = true;
      window.addEventListener("storage", e => { if (e.key==="bmts-demo-data") { const b=this.data.notifications; this.data = lsGet("bmts-demo-data", this.data); COLLS.forEach(c=>{ this.data[c] = this.data[c] || {}; }); Notif.onData(b, this.data.notifications); render(); } });
    }
    render();
  },
  async put(c, id, obj){
    const clean = JSON.parse(JSON.stringify(obj)); clean.v = SCHEMA;
    if (this.mode==="shared") {
      try { await this.db.collection(c).doc(id).set(clean); }
      catch(e){ if (e && (e.code==="invalid_argument" || e.code==="permission-denied")) { this.readOnly=true; toast("Хадгалах эрхгүй","Мэдээллийн сангийн эрх хаагдсан байна. Firebase-ийн дүрмийг шалгана уу."); } else toast("Хадгалж чадсангүй", (e&&e.message)||"Дахин оролдоно уу."); throw e; }
    } else {
      const before = this.data.notifications;
      this.data[c] = {...this.data[c], [id]: clean}; lsSet("bmts-demo-data", this.data);
      if (c==="notifications") Notif.onData(before, this.data.notifications);
      render();
    }
  },
  async del(c, id){
    if (this.mode==="shared") { try { await this.db.collection(c).doc(id).delete(); } catch {} }
    else { const m = {...this.data[c]}; delete m[id]; this.data[c] = m; lsSet("bmts-demo-data", this.data); render(); }
  },
  list(c){ return Object.entries(this.data[c]).filter(([id,v])=>v && v.v===SCHEMA).map(([id,v])=>({...v, id})); },
  get(c, id){ const v = this.data[c][id]; return v ? {...v, id} : null; },
};

  seen: new Set(lsGet("bmts-seen", [])), started:false, shownAtLoad:new Set(),
  forMe(n){
    if (!ME) return false;
    if (ME.role==="admin") return n.role!=="__none";

    const sc = myScope(); if (n.dept && sc && n.dept!==sc) return false;

  mine(){ return Store.list("notifications").filter(n=>this.forMe(n)).sort((a,b)=>b.at-a.at); },
  unread(){ return this.mine().filter(n=>!this.seen.has(n.id)).length; },
  markAll(){ this.mine().forEach(n=>this.seen.add(n.id)); lsSet("bmts-seen",[...this.seen].slice(-800)); render(); },
  mark(id){ this.seen.add(id); lsSet("bmts-seen",[...this.seen].slice(-800)); },
  onData(before, after){
    if (!this.started) { this.started = true; Object.keys(after).forEach(k=>this.shownAtLoad.add(k)); return; }
    const fresh = Object.entries(after).filter(([id])=>!before[id] && !this.shownAtLoad.has(id)).map(([id,v])=>({...v,id}));
    fresh.filter(n=>this.forMe(n)).slice(-2).forEach(n => toast(n.title, n.body, n.link, n.id));
  },
};

/* ===================== Захиалгын логик ===================== */
const stepOf = o => STEPS[o.step] || null;
function stateOf(o){
  if (o.rejected) return ["Буцаагдсан","err"];
  if (o.step>=STEPS.length) return ["Хүлээлгэн өгсөн","ok"];
  if (o.step===0) return ["Ноорог",""];
  for (const [l,a,b] of BAR) if (o.step>=a && o.step<=b) return [l, o.step>=11 ? "warn" : o.step>=6 ? "info" : "brand"];
  return ["",""];
}
function canAct(o){
  if (!ME || o.rejected || o.step>=STEPS.length) return false;
  const s = stepOf(o); if (!s || s.auto) return false;
  if (ME.role==="admin") return true;
  if (s.k==="load") return ME.role==="dispatcher" || ME.role==="driver" || ME.role==="keeper";
  if (s.role!==ME.role) return false;
  if (s.dept && ME.dept!==o.dept) return false;
  if (s.cat && ME.cat!==o.cat) return false;
  if (s.shift && ME.shift!==dutyShift()) return false;
  return true;
}
function waitingWho(o){
  const s = stepOf(o); if (!s) return "";
  const r = s.k==="load" ? "Диспетчер / жолооч" : roleName(s.role);
  if (s.cat) return `${r} · ${CATS[o.cat]}`;
  if (s.shift) return `${r} · ${dutyLabel()}`;
  return s.dept ? `${r} (${DEPTS[o.dept].name})` : r;
}
function nextNo(prefix, field){
  const used = Store.list("orders").map(o=>o[field]).filter(Boolean).map(v=>parseInt(String(v).split(/[\/-]/).pop(),10)||0);
  return prefix + String((used.length ? Math.max(...used) : 0) + 1).padStart(5,"0");
}
function nextIncomeNo(){
  const used = Store.list("orders").map(o=>parseInt(o.income_no,10)||0);
  return String(Math.max(INCOME_START-1, ...used) + 1);
}
function nextDeliveryNo(){
  const used = Store.list("deliveries").map(d=>parseInt(String(d.no).split("/").pop(),10)||0);
  return "ХРГ/2026/" + String((used.length?Math.max(...used):0)+1).padStart(4,"0");
}
const amount = o => o.lines.reduce((s,l)=>s + (l.qa ?? l.qr) * l.price, 0);

async function advance(o, comment, by){
  o = JSON.parse(JSON.stringify(o));
  const s = stepOf(o);
  o.history.push({k:s.k, n: s.sig ? `Гарын үсэг ${sigNo(s)}/${SIG_TOTAL} · ${s.n}` : s.n, by: by || ME.name, role: ME.role, at: now(), c: comment||""});
  o.step++;
  // автомат алхам
  while (o.step < STEPS.length && STEPS[o.step].auto) {
    o.income_no = o.income_no || nextIncomeNo();
    o.history.push({k:STEPS[o.step].k, n:STEPS[o.step].n, by:"Систем", role:"system", at: now(), c:"Олгосон: "+o.income_no});
    o.step++;
  }
  o.updated = now();
  await Store.put("orders", o.id, o);
  await announce(o);
  return o;
}
async function announce(o){
  const link = "o-"+o.id;
  if (o.step>=STEPS.length) {
    await notify("keeper", "Хүлээлгэн өгсөн: "+o.no, `${DEPTS[o.dept].name} хүлээн авлаа${o.discrepancy?" (тоо зөрүүтэй)":""}.`, link);
    return;
  }
  const s = STEPS[o.step], U = o.urgent ? "ЯАРАЛТАЙ · " : "";
  if (s.k==="load") {
    if (o.urgent) { await notify("dispatcher", U+"Нөөц машинаар гаргах: "+o.no, `${DEPTS[o.dept].name} · ${o.lines.length} мөр. Хуваарь хүлээхгүй, нөөц машинаар даруй хүргэнэ үү.`, "dl"); return; }
    await notify("dispatcher", "Ачихад бэлэн: "+o.no, `${DEPTS[o.dept].name} · ${o.lines.length} мөр. Хүргэлт төлөвлөнө үү.`, "dl"); return;
  }
  if (s.k==="gate" || s.k==="receive") return;
  const scope = s.dept ? o.dept : s.cat ? o.cat : s.shift ? "s"+dutyShift() : null;
  const what = s.sig ? `Гарын үсэг ${sigNo(s)}/${SIG_TOTAL} таны ээлж` : "Таны ээлж";
  await notify(s.role, U+what+": "+o.no, `${DEPTS[o.dept].name} · ${CATS[o.cat]} · ${o.lines.length} мөр · ${money(amount(o))}. Өмнөх гарын үсэг зурагдлаа, одоо та: ${s.d}.`, link, scope);
  if (s.k==="bmts") await notify("nyarav", "Орлогын дугаар гарлаа: "+o.no, `Орлогын № ${o.income_no}. Одоо БМТС-ийн дарга зурна.`, link, o.dept);
  if (s.k==="accept") await notify("nyarav", "БМТС-д очлоо: "+o.no, "Хангамж, БМТС-ийн даргын гарын үсэг зурагдлаа.", link, o.dept);
  if (s.k==="issue") await notify("nyarav", "Бэлтгэгдэж байна: "+o.no, "БМТС-ийн нярав хүлээн авч, барааг бэлтгэж эхэллээ.", link, o.dept);
}

function bindLogin(){

/* Гарын үсгийн дараалал: зурагдсан, одоогийн, түгжээтэй */
function ladder(o){
  const done = sigDone(o), fin = o.step>=STEPS.length;
  const last = k => { for (let i=o.history.length-1;i>=0;i--) if (o.history[i].k===k) return o.history[i]; return null; };
  return `<div class="sheet" style="margin-top:12px"><h2 style="font-size:17px">Гарын үсгийн дараалал · ${done}/${SIG_TOTAL}</h2>
    <div class="sigp"><i style="width:${Math.round(100*done/SIG_TOTAL)}%"></i></div>
    <p class="sub" style="margin:0">Өмнөх гарын үсэг зурагдаж байж дараагийнх нээгдэнэ. Нээгдэх үед тухайн хүнд мэдэгдэл, мессеж очно.</p>
    <ol class="lad">${STEPS.map((st,i)=>{
      const isDone = i<o.step, isCur = i===o.step && !fin, rej = isCur && o.rejected, h = isDone ? last(st.k) : null;
      const cls = (st.sig?"":"work ") + (isDone?"done":rej?"rej":isCur?"cur":"lock");
      let sub;
      if (isDone) sub = st.auto ? `Олгосон: № ${esc(o.income_no||"")}` : `Зурсан: ${esc(h?h.by:"")} · ${h?fmtT(h.at):""}${st.k==="sdisp"?` <span class="stamp">ТАМГА</span>`:""}`;
      else if (rej) sub = `Буцаасан: ${esc(o.rejected.by)}. ${esc(o.rejected.c)}`;
      else if (isCur) sub = st.auto ? "Автоматаар үүснэ" : `<b>Одоо ${st.sig?"зурах":"хийх"} ээлж:</b> ${esc(waitingWho(o))}`;
      else sub = "Түгжээтэй: өмнөх алхам дууссаны дараа нээгдэнэ";
      if (isDone && !st.sig && !st.auto) sub = `Хийсэн: ${esc(h?h.by:"")} · ${h?fmtT(h.at):""}`;
      return `<li class="${cls}"><span class="n">${st.sig?sigNo(st):""}</span><div class="b"><div class="t">${esc(st.n)}</div><div class="d">${esc(st.d)}</div><div class="s">${sub}</div></div></li>`;
    }).join("")}</ol></div>`;
}
function histTable(o){
  const rows = []; let prev = o.created;

async function doStep(id){
  let o = Store.get("orders", id); if (!o || !canAct(o)) return;
  const s = stepOf(o);
  if (s.editQty || s.issueQty) {
    const f = s.issueQty ? "qi" : "qa";
    o.lines = o.lines.map((l,i)=>{ const el=$("#q-"+i); const v = el ? parseFloat(el.value) : NaN; return {...l, [f]: v>=0 ? v : (f==="qi" ? (l.qi ?? l.qa) : l.qa)}; });
  }
  let c = "";
  if (s.k==="sdisp") { o.gate_no = nextNo("ГЗ/2026/","gate_no"); c = `Гарах зөвшөөрөл: ${o.gate_no} · ${dutyShift()}-р ээлж · тамга дарагдсан`; }
  if (s.k==="issue") c = "Зарлагадсан: " + o.lines.map(l=>qtyFmt(l.qi)+" "+l.uom).join(", ");

async function doReject(id){

/* Хүргэлтийн газрын зураг: Google Earth-д зурсан замууд */
function routeMap(d){
  const ks=d.stops.map(s=>s.dept).filter(k=>DEPTS[k].lat); if(!ks.length) return "";
  const P=[WH_GEO, ...ks.flatMap(k=>[DEPTS[k], ...(DEPTS[k].route||[]).map(([lat,lng])=>({lat,lng}))])];
  const W=340,H=220,pad=18, kx=Math.cos(49.04*Math.PI/180);
  const xs=P.map(p=>p.lng*kx), ys=P.map(p=>p.lat), x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
  const sc=Math.min((W-2*pad)/((x1-x0)||1e-4),(H-2*pad)/((y1-y0)||1e-4));
  const X=p=>(pad+(p.lng*kx-x0)*sc).toFixed(1), Y=p=>(H-pad-(p.lat-y0)*sc).toFixed(1);
  const firstOpen=d.stops.findIndex(x=>x.state!=="delivered");
  const lines=d.stops.map((s,i)=>{const r=DEPTS[s.dept].route; if(!r) return ""; const cls=s.state==="delivered"?"done":i===firstOpen?"cur":"";
    return `<polyline class="${cls}" points="${r.map(([lat,lng])=>X({lat,lng})+","+Y({lat,lng})).join(" ")}"/>`;}).join("");
  const dots=d.stops.map((s,i)=>{const p=DEPTS[s.dept]; if(!p.lat) return ""; return `<g><circle cx="${X(p)}" cy="${Y(p)}" r="9" class="${s.state==="delivered"?"done":""}"/><text x="${X(p)}" y="${Y(p)}" dy="3.5">${i+1}</text><text class="lb" x="${X(p)}" y="${Y(p)}" dy="-13">${esc(p.name)}</text></g>`;}).join("");
  return `<figure class="rmap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Хүргэлтийн маршрут">${lines}<g><rect x="${+X(WH_GEO)-8}" y="${+Y(WH_GEO)-8}" width="16" height="16" rx="3"/><text class="lb" x="${X(WH_GEO)}" y="${Y(WH_GEO)}" dy="20">БМТС</text></g>${dots}</svg>
    <figcaption>Шар зам: одоо явах · саарал: хүргэсэн. Замууд Google Earth-д зурсан бодит чиглэлээр.</figcaption></figure>`;
}

    <button class="btn primary block" style="margin-top:12px" onclick="loaded('${d.id}')">Тоолж хүлээн авлаа, ачиж дууслаа</button>`;

async function loaded(id){
  const d = Store.get("deliveries", id); if (!d || d.state!=="planned") return;
  makeAct.extra = 0;
  for (const st of d.stops) for (const oid of st.orders) {
    const o = Store.get("orders", oid); if (!o || o.step!==SI.load) continue;
    o.lines = o.lines.map((l,li)=>{ const v = parseFloat($(`#q-ld-${o.id}-${li}`)?.value); return {...l, qd: v>=0 ? v : (l.qi ?? l.qa)}; });
    const diff = o.lines.filter(l=>l.qd !== (l.qi ?? l.qa)).map(l=>({...l, exp:(l.qi ?? l.qa), got:l.qd}));
    const act = diff.length ? makeAct(o, "load", diff, ME.name) : null;
    await advance(o, `Жолооч тоолж хүлээн авав (${d.vehicle.plate})` + (act?` · зөрүүний акт ${act.no}`:""));
    if (act) await announceAct(o, act);
  }
  DIRTY.clear();
  const nd = {...d, state:"out", loaded_at: now(), gate_token: token(6)};
  await Store.put("deliveries", id, nd);
  await notify("driver", "Ачиж дууслаа: "+d.no, "Постын QR-аа харуулд уншуулна уу.", "drv");
  await notify("guard", "Машин гарахаар ирж байна", `${d.vehicle.plate} · ${d.stops.length} цехийн бараа`, "post");
  for (const st of d.stops) await notify("nyarav", "Бараа хүргэлтэнд гарлаа", `${d.vehicle.plate} машинд ачигдлаа. Ойртоход мэдэгдэнэ.`, "o-"+st.orders[0], st.dept);
}

function driverStopActions(d, s, i){
  if (d.state!=="out" || !d.gate_at || s.state==="delivered") return "";
  const firstOpen = d.stops.findIndex(x=>x.state!=="delivered");
  if (i!==firstOpen) return `<p class="sub" style="margin:8px 0 0">Өмнөх цехэд хүргэсний дараа.</p>`;
  const total = legOf(d,i);
  const left = s.left==null ? total : s.left;
  const pct = Math.round(100*(1-left/total));
  const eta = Math.max(1, Math.ceil(left/SPEED*60));
  if (s.state==="pending" || s.state==="notified") {
    const running = SIM && SIM.d===d.id && SIM.i===i;
    return `<div class="road" aria-hidden="true"><i style="width:${pct}%"></i></div>
      <div class="sub">Үлдсэн ${left.toFixed(1)} км · ~${eta} мин${s.state==="notified"?" · няравт мессеж очсон ✔":` · ${NOTIFY_KM} км-т ойртоход няравт мэдэгдэнэ`}</div>
      <div class="cp" style="margin-top:8px">
        <button class="btn ${running?"":"primary"}" onclick="toggleDrive('${d.id}',${i})">${running?"Зогсоох":"Явах (GPS дуурайлга)"}</button>
        <button class="btn" onclick="arrive('${d.id}',${i})">Цехэд ирлээ</button>
      </div>`;
  }
  if (s.state==="arrived") {
    const url = baseUrl() + "#recv-" + s.htoken;
    return `<div class="alert warn" style="margin:10px 0 0">Ирсэн ${fmtHM(s.arrived_at)}. Нярав барааг тулгаж баталгаажуулна.</div>
      <b style="display:block;margin-top:10px">1. Нярав утсаараа уншуулна</b>
      <div class="qr"><div data-qr="${esc(url)}"></div><div class="code">${esc(s.htoken)}</div><small>Нярав камераар уншуулна, эсвэл “Миний ээлж” апп-д кодыг бичнэ.</small></div>
      <b style="display:block">2. Няравын утсанд Odoo нээгдэхгүй бол: SMS код</b>
      <div class="sub">Няравт 6 оронтой код мэдэгдлээр очсон. Нярав барааг шалгаад кодоо танд хэлнэ.</div>
      <div class="line-add" style="grid-template-columns:1fr auto;margin-top:6px"><div class="inp"><input id="code-${i}" inputmode="numeric" maxlength="6" placeholder="Няравын хэлсэн код" aria-label="Няравын код"></div><button class="btn ok" onclick="verifyOtp('${d.id}',${i})">Баталгаажуулах</button></div>`;
  }
  return "";
}
function toggleDrive(did, i){
  if (SIM) { clearInterval(SIM.t); const same = SIM.d===did && SIM.i===i; SIM=null; render(); if (same) return; }
  SIM = {d:did, i, t:setInterval(()=>tick(did,i), 2500)}; render(); tick(did,i);
}
let ticking=false;
async function tick(did, i){
  if (ticking) return; ticking = true;
  try {
    const d = Store.get("deliveries", did); if (!d) { clearInterval(SIM?.t); SIM=null; return; }
    const s = d.stops[i]; if (!s || !["pending","notified"].includes(s.state)) { clearInterval(SIM?.t); SIM=null; render(); return; }
    const total = legOf(d,i);
    const left = Math.max(0, (s.left==null ? total : s.left) - SIM_STEP);
    const stops = d.stops.map((x,j)=> j===i ? {...x, left} : x);
    let notifyNow = false;
    if (s.state==="pending" && left <= NOTIFY_KM) { stops[i] = {...stops[i], state:"notified", notified_at: now()}; notifyNow = true; }
    await Store.put("deliveries", did, {...d, stops});
    if (notifyNow) {
      const eta = Math.max(1, Math.ceil(left/SPEED*60));
      await notify("nyarav", "Бараа ойртож байна", `Таны ${stopOrders(s).map(o=>o.no).join(", ")} захиалгын бараа ойролцоогоор ${eta} минутын дараа ${DEPTS[s.dept].name}-д хүргэгдэнэ (${left.toFixed(1)} км). Хүлээн авахад бэлэн байна уу.`, "o-"+s.orders[0], s.dept);
      toast("Няравт мессеж очлоо", `${DEPTS[s.dept].name}: ~${eta} мин`);
    }
    if (left<=0) { clearInterval(SIM?.t); SIM=null; render(); }
  } finally { ticking = false; }
}
async function arrive(did, i){
  if (SIM) { clearInterval(SIM.t); SIM=null; }
  const d = Store.get("deliveries", did); if (!d) return;
  const s = d.stops[i];
  const stops = d.stops.map((x,j)=> j===i ? {...x, state:"arrived", arrived_at:now(), left:0, htoken:token(6), otp:pin6()} : x);
  await Store.put("deliveries", did, {...d, stops});
  await notify("nyarav", "Жолооч ирлээ", `${d.vehicle.plate} ${DEPTS[s.dept].name}-д ирлээ. Барааг тулгаад жолоочийн QR-ыг уншуулна уу. Хүлээлгэн өгөх код: ${stops[i].otp}`, "recv-"+stops[i].htoken, s.dept);
}
async function verifyOtp(did, i){
  const d = Store.get("deliveries", did); if (!d) return;
  const s = d.stops[i], code = ($("#code-"+i)?.value||"").trim();
  if (code !== s.otp) { toast("Код буруу","Няравын хэлсэн 6 оронтой кодыг дахин шалгана уу."); return; }
  const os = stopOrders(s).map(o=>({...o, lines:o.lines.map(l=>({...l, qx: l.qi ?? l.qa}))}));
  await finishReceive(os, "otp", d, i, os[0]?.requester || "Цехийн нярав");
}

async function recvConfirm(did, i){
  const d = Store.get("deliveries", did); if (!d) return;
  const s = d.stops[i];
  const note = ($("#f-rnote")?.value||"").trim();
  const os = stopOrders(s).map(o=>({...o, recv_note: note, lines:o.lines.map((l,li)=>{ const v = parseFloat($(`#q-${o.id}-${li}`)?.value); return {...l, qx: v>=0 ? v : (l.qd ?? l.qi ?? l.qa)}; })}));
  await finishReceive(os, "qr", d, i, ME.name);
}
async function finishReceive(orders, method, d, i, receiver){
  receiver = receiver || ME.name; makeAct.extra = 0;
  for (let o of orders) {
    const diff = o.lines.filter(l => l.qx !== (l.qd ?? l.qi ?? l.qa)).map(l=>({...l, exp:(l.qd ?? l.qi ?? l.qa), got:l.qx}));
    o.discrepancy = diff.length>0 || (o.acts||[]).length>0;
    o.handover = method;
    const act = diff.length ? makeAct(o, "recv", diff, receiver) : null;
    await advance(o, (method==="qr"?"QR уншуулж":method==="otp"?"SMS кодоор":"Маягтаар") + " хүлээн авав" + (o.recv_note?": "+o.recv_note:"") + (o.discrepancy?" (зөрүүтэй)":""), receiver);
    if (act) await announceAct(o, act);
  }
  if (!d) { const did = orders[0]?.delivery; d = did ? Store.get("deliveries", did) : null; if (d) i = d.stops.findIndex(s=>s.orders.includes(orders[0].id)); }
  if (d && i>=0) {
    const fresh = Store.get("deliveries", d.id);
    const stops = fresh.stops.map((x,j)=> j===i ? {...x, state:"delivered", delivered_at: now(), received_by: receiver, method, htoken:null} : x);
    const done = stops.every(x=>x.state==="delivered");
    await Store.put("deliveries", d.id, {...fresh, stops, state: done ? "done" : fresh.state, done_at: done ? now() : null});
    await notify("driver", "Хүлээлгэн өглөө", `${DEPTS[fresh.stops[i].dept].name}${done?" — бүх цехэд хүргэж дууслаа.":" — дараагийн цех рүү явна уу."}`, "drv");
  }
  toast("Хүлээн авлаа", orders.map(o=>o.no).join(", ") + " цахимаар баталгаажлаа.");
  if (VIEW.startsWith("recv-")) go("o-"+orders[0].id);
}

/* ---------- Тайлан: үе шат тус бүрийг тусад нь ---------- */
const lastH = (o,k) => { for (let i=o.history.length-1;i>=0;i--) if (o.history[i].k===k) return o.history[i].at; return null; };
function phases(o){
  const appr = lastH(o,"bmts"), ready = lastH(o,"sdisp"), recv = lastH(o,"receive");
  return {
    appr: appr ? appr - o.created : null,          // илгээснээс БМТС-ийн дарга батлах хүртэл
    wh:   appr && ready ? ready - appr : null,     // БМТС хүлээн авснаас гарах бичиг хүртэл
    dlv:  ready && recv ? recv - ready : null,     // ачихад бэлэн болсноос цехэд хүлээлгэн өгөх хүртэл
  };
}
const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
function vReport(){
  const os = Store.list("orders");
  const done = os.filter(o=>o.step>=STEPS.length), active = os.filter(o=>o.step<STEPS.length && !o.rejected);
  const ph = os.map(o=>({o, ...phases(o)}));
  const col = (k, f) => ph.filter(x=>x[k]!=null && (!f || f(x.o))).map(x=>x[k]);
  const PH = [["appr","Батлалт","Илгээснээс бүх гарын үсэг (БМТС-ийн дарга) хүртэл"],["wh","БМТС склад","Хүлээн авснаас бэлтгэж, гарах бичиг авах хүртэл"],["dlv","Хүргэлт","Ачихад бэлэн болсноос цехэд хүлээлгэн өгөх хүртэл"]];
  // батлалтын шат бүр: хэн дээр удаж байна
  const per = {};
  os.forEach(o=>{ let prev=o.created; o.history.forEach(h=>{ if(h.role!=="system" && h.k!=="submit" && h.k!=="reject"){ (per[h.k]=per[h.k]||[]).push(h.at-prev);} prev=h.at; }); });
  const apprSteps = ["head","supply","senior","bmts"], whSteps = ["accept","issue","gdisp","sdisp"], dlSteps = ["load","gate","receive"];
  const bars = keys => { const rows = STEPS.filter(s=>keys.includes(s.k) && per[s.k]).map(s=>({n:s.n, v:avg(per[s.k])})); const mx = Math.max(1,...rows.map(r=>r.v));
    return rows.length ? `<div class="bars">${rows.map(r=>`<div class="bar"><span>${esc(r.n)}</span><div class="tr"><i style="width:${Math.max(2,Math.round(100*r.v/mx))}%"></i></div><span class="v">${dur(r.v)}</span></div>`).join("")}</div>` : `<div class="sub">Өгөгдөл алга.</div>`; };
  const slow = STEPS.filter(s=>apprSteps.includes(s.k) && per[s.k]).sort((a,b)=>avg(per[b.k])-avg(per[a.k]))[0];
  // хүргэлт
  const dls = Store.list("deliveries");
  const road = dls.filter(d=>d.gate_at && d.done_at).map(d=>d.done_at-d.gate_at);
  const urgD = dls.filter(d=>d.kind==="urgent");
  // буцаалт
  const rets = Store.list("returns");
  const byReason = RETURN_REASONS.map(x=>[x, rets.filter(r=>r.reason===x).length]).filter(x=>x[1]);
  const pickT = rets.filter(r=>r.picked_at).map(r=>r.picked_at-r.created), fullT = rets.filter(r=>r.received_at).map(r=>r.received_at-r.created);
  return `${nav("Тайлан")}<div class="wrap">${banner()}
    <div class="kpis">
      <div class="kpi"><div class="v">${os.length}</div><div class="l">Нийт захиалга</div></div>
      <div class="kpi"><div class="v">${active.length}</div><div class="l">Явцад байгаа</div></div>
      <div class="kpi"><div class="v">${done.length}</div><div class="l">Хүлээлгэн өгсөн</div></div>
      <div class="kpi"><div class="v">${os.filter(o=>o.urgent).length}</div><div class="l">Үүнээс яаралтай</div></div>
      <div class="kpi"><div class="v">${done.filter(o=>o.discrepancy).length}</div><div class="l">Зөрүүтэй хүлээн авалт</div></div>
      <div class="kpi"><div class="v">0 км</div><div class="l">Цехийн нярав явсан зам</div></div>
    </div>

    <div class="sheet"><h2 style="font-size:17px">Хаана хугацаа зарцуулж байна вэ</h2>
      <p class="sub" style="margin:0">Захиалгын нийт хугацааг 3 үе шатад хуваана. Аль нь удааширч байгааг тусад нь харна.</p>
      <div class="phase">${PH.map(([k,n,d])=>`<div><div class="l">${n}</div><div class="v">${dur(avg(col(k)))}</div><div class="n">${d}</div><div class="n">${col(k).length} захиалга</div></div>`).join("")}</div>
      <div class="tbl-wrap"><table class="t"><tr><th>Дундаж</th>${PH.map(([k,n])=>`<th class="n">${n}</th>`).join("")}</tr>
        <tr><td>Хуваарьт</td>${PH.map(([k])=>`<td class="n">${dur(avg(col(k,o=>!o.urgent)))}</td>`).join("")}</tr>
        <tr><td><span class="pill err">Яаралтай</span></td>${PH.map(([k])=>`<td class="n">${dur(avg(col(k,o=>o.urgent)))}</td>`).join("")}</tr>
      </table></div>
    </div>

    <div class="sheet" style="margin-top:12px"><h2 style="font-size:17px">1. Батлалт: шат бүрийн хүлээсэн хугацаа</h2>
      ${slow?`<div class="alert warn">Хамгийн удаан: <b>${esc(slow.n)}</b> (дунджаар ${dur(avg(per[slow.k]))})</div>`:""}
      ${bars(apprSteps)}
    </div>
    <div class="sheet" style="margin-top:12px"><h2 style="font-size:17px">2. БМТС склад</h2>${bars(whSteps)}</div>
    <div class="sheet" style="margin-top:12px"><h2 style="font-size:17px">3. Хүргэлт</h2>
      ${bars(dlSteps)}
      <div class="fields" style="margin-top:10px">
        <div class="f"><label>Хүргэлт</label><div>${dls.length} (яаралтай ${urgD.length})</div></div>
        <div class="f"><label>Постоос гараад бүгдийг хүргэх</label><div>${dur(avg(road))}</div></div>
      </div>
    </div>
    <div class="sheet" style="margin-top:12px"><h2 style="font-size:17px">Буцаалт</h2>
      <div class="fields">
        <div class="f"><label>Нийт</label><div>${rets.length} · идэвхтэй ${rets.filter(r=>r.state!=="received").length}</div></div>
        <div class="f"><label>Хүсэлтээс ачиж авах хүртэл</label><div>${dur(avg(pickT))}</div></div>
        <div class="f"><label>Хүсэлтээс БМТС хүлээн авах хүртэл</label><div>${dur(avg(fullT))}</div></div>
      </div>
      ${byReason.length?`<div class="bars" style="margin-top:10px">${byReason.map(([n,v])=>`<div class="bar"><span>${esc(n)}</span><div class="tr"><i style="width:${Math.round(100*v/Math.max(...byReason.map(x=>x[1])))}%"></i></div><span class="v">${v}</span></div>`).join("")}</div>`:""}
      <p class="sub" style="margin-top:10px">Шалтгаанаар ангилсан нь нийлүүлэгч, гэрээ, бэлтгэлийн алдааг илрүүлэхэд хэрэгтэй.</p>
    </div>
    <p class="sub" style="margin-top:12px">Цаасан процесст нэг шаардахад цехийн нярав 20–32 км явж, 2–15 цаг зарцуулдаг байсан (Цахилгаан, Авто тээврийн, УМ цехийн хэмжилт).</p>
  </div>`;
}

    ${!list.length?`<div class="empty"><b>Мэдэгдэл алга</b>Таны гарын үсгийн ээлж ирэх, бараа ойртох үед энд гарна.</div>`:
      NTAB==="sms"?`<p class="sub" style="margin:0 0 10px">Мэдэгдэл бүр утасны дугаарт мессежээр давхар очих текст. Мессеж бодитоор илгээгдэхийн тулд Odoo-д үүрэн операторын мессежийн үйлчилгээ холбогдсон байх ёстой.</p>
        ${list.map(n=>`<div class="sms">БМТС: ${esc(n.title)}. ${esc(n.body)}<span class="when">${fmtT(n.at)}</span></div>`).join("")}`:
      `<div class="list">${list.map(n=>`<div class="ntf ${Notif.seen.has(n.id)?"":"unread"}" onclick="Notif.mark('${n.id}');go('${esc(n.link||"home")}')"><div style="flex:1;min-width:0"><div class="tt">${esc(n.title)}</div><div class="tb">${esc(n.body)}</div></div><span class="when">${fmtHM(n.at)}</span></div>`).join("")}</div>`}
  </div>`;
}

/* ---------- Тохиргоо ---------- */
function vMe(){
  return `${nav("Миний тохиргоо")}<div class="wrap">${banner()}
    <div class="sheet"><h2>${esc(ME.name)}</h2>
      <div class="f"><label>Дүр</label><div>${esc(roleName(ME.role))}</div></div>
      ${ME.dept?`<div class="f"><label>Цех</label><div>${esc(DEPTS[ME.dept].name)}</div></div>`:""}
      ${ME.cat?`<div class="f"><label>Хариуцсан ангилал</label><div>${esc(CATS[ME.cat])}</div></div>`:""}
      ${ME.shift?`<div class="f"><label>Ээлж</label><div>${ME.shift}-р ээлж · одоо жижүүрт: ${esc(dutyLabel())}</div></div>`:""}
      <div class="f"><label>Горим</label><div>${Store.mode==="shared"?"Хуваалцсан (бүх гишүүн)":"Зөвхөн энэ утсанд"}</div></div>
      <div class="cp" style="margin-top:12px"><button class="btn primary" onclick="ME=null;render()">Дүр солих</button></div>
    </div>
    <div class="sheet" style="margin-top:12px;text-align:center"><h2 style="font-size:17px;text-align:left">Аппыг өөр утсанд нээх</h2>
      <p class="sub" style="font-size:14px;text-align:left">Нөгөө хүн утасныхаа камерыг энэ QR-д чиглүүлээд гарч ирсэн холбоосыг дарна.</p>
      <div class="qr"><div data-qr="${esc(baseUrl())}"></div></div>
      <p class="sub" style="word-break:break-all">${esc(baseUrl())}</p>
    </div>
    ${ME.role==="admin"?`<div class="sheet" style="margin-top:12px"><h2 style="font-size:17px">Өгөгдөл цэвэрлэх</h2>
      <p class="sub" style="font-size:14px">Бүх захиалга, хүргэлт, буцаалт, мэдэгдлийг устгана.</p>
      ${CONFIRM==="wipe"?`<div class="confirm"><b>Бүх өгөгдлийг устгах уу?</b> Бусад гишүүдийн утсан дээр ч устна.<div class="cp" style="margin-top:8px"><button class="btn danger" onclick="wipe()">Тийм, устгах</button><button class="btn" onclick="CONFIRM=null;render()">Болих</button></div></div>`:
      `<button class="btn danger" onclick="CONFIRM='wipe';render()">Бүгдийг устгах</button>`}</div>`:""}
  </div>`;
}
async function wipe(){
  CONFIRM=null;
  for (const c of COLLS) for (const x of Store.list(c)) await Store.del(c, x.id);
  toast("Цэвэрлэлээ","Бүх өгөгдөл устлаа.");
}

/* ---------- QR ---------- */
function baseUrl(){ return ART_URL || location.href.split("#")[0]; }
function drawQRs(){
  if (!window.QRCode) return;
  document.querySelectorAll("[data-qr]").forEach(el=>{
    if (el.dataset.done===el.dataset.qr) return;
    el.innerHTML=""; el.dataset.done = el.dataset.qr;
    try { new QRCode(el, {text: el.dataset.qr, width: 210, height: 210, correctLevel: QRCode.CorrectLevel.M}); } catch {}
  });
}

Store.init();
render();
</script>
